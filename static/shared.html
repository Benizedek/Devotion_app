<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat · Daily Bread</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="chat-main">
    <div class="chat-layout" id="layout">
      <aside class="card chat-list">
        <div class="chat-list-head">
          <h2>Chats</h2>
          <a class="button-link" href="/groups">+ New</a>
        </div>
        <ul class="conv-list" id="conv-list"></ul>
      </aside>

      <section class="card chat-thread">
        <div id="thread-empty" class="thread-empty muted">Pick a chat, or start a new one.</div>
        <div id="thread-body" class="thread-body hidden">
          <header class="thread-head">
            <button id="back" class="back" aria-label="Back to chats">‹</button>
            <div class="thread-title">
              <h2 id="thread-title"></h2>
              <div class="muted small" id="thread-sub"></div>
            </div>
            <button id="settings-btn" aria-expanded="false" aria-controls="settings">⚙ Settings</button>
          </header>
          <div id="settings" class="thread-info hidden"></div>
          <div id="share-banner" class="share-banner hidden">
            You're not sharing your devotions or prayer list here.
            <button class="link" id="banner-settings">Open settings</button>
          </div>
          <div id="messages" class="messages" aria-live="polite"></div>
          <form id="composer" class="composer">
            <input id="msg-input" placeholder="Message…" maxlength="4000" autocomplete="off" aria-label="Message">
            <button class="primary" type="submit">Send</button>
          </form>
        </div>
      </section>
    </div>
  </main>
  <script src="/static/common.js"></script>
  <script src="/static/shared.js"></script>
</body>
</html>
