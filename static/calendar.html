<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Devotions · Daily Bread</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="narrow stack">
    <section class="card">
      <div class="cal-head">
        <button id="prev" aria-label="Previous month">‹</button>
        <h2 id="month-label"></h2>
        <button id="next" aria-label="Next month">›</button>
      </div>
      <div class="cal" id="cal"></div>
    </section>

    <section class="card stack" id="editor">
      <div class="card-head">
        <div>
          <h2 id="editor-date"></h2>
          <div class="muted" id="editor-status"></div>
        </div>
        <button id="today-btn" class="hidden">Go to today</button>
      </div>

      <!-- Past days: read-only -->
      <div id="read-view" class="hidden"></div>

      <!-- Today: editable -->
      <div id="edit-view" class="stack hidden">
        <div>
          <label for="scripture">Scripture</label>
          <input id="scripture" maxlength="300" placeholder="e.g. Psalm 23:1–3">
        </div>
        <div class="oia">
          <label for="observations">Observations</label>
          <p class="hint">What does the passage say? Who, what, where, when?</p>
          <textarea id="observations"></textarea>
        </div>
        <div class="oia">
          <label for="interpretation">Interpretation</label>
          <p class="hint">What does it mean? What does it show about God?</p>
          <textarea id="interpretation"></textarea>
        </div>
        <div class="oia">
          <label for="application">Application</label>
          <p class="hint">How will I live this out today?</p>
          <textarea id="application"></textarea>
        </div>
        <div class="error" id="editor-error"></div>
        <div class="row">
          <button class="primary" id="save">Save</button>
          <button class="danger hidden" id="delete">Delete</button>
        </div>
        <p class="muted small" id="visible-to"></p>
      </div>
    </section>
  </main>
  <script src="/static/common.js"></script>
  <script src="/static/calendar.js"></script>
</body>
</html>
