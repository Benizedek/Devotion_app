<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Bread</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="auth">
    <h1>Daily Bread</h1>
    <p class="muted center">Keep your devotions. Carry each other's prayers.</p>
    <form id="auth-form" class="card stack">
      <div id="name-field" class="hidden">
        <label for="display_name">Your name</label>
        <input id="display_name" autocomplete="name">
      </div>
      <div>
        <label for="username">Username</label>
        <input id="username" autocomplete="username" required>
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="error" id="error"></div>
      <button class="primary" type="submit" id="submit">Log in</button>
      <p class="muted">
        <span id="switch-text">New here?</span>
        <button type="button" class="link" id="switch">Create an account</button>
      </p>
    </form>
  </main>
  <script src="/static/common.js"></script>
  <script src="/static/login.js"></script>
</body>
</html>
